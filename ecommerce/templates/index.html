<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMINA — Modern Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg2: #111111;
  --bg3: #1a1a1a;
  --border: #2a2a2a;
  --accent: #c8a96e;
  --accent2: #e8c99e;
  --text: #f0ece4;
  --text2: #888;
  --text3: #555;
  --danger: #c0392b;
  --success: #27ae60;
  --radius: 2px;
  --font-display: 'Cormorant Garamond', serif;
  --font-mono: 'DM Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px;
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 300; letter-spacing: 6px;
  color: var(--accent); text-transform: uppercase;
  cursor: pointer;
}
.nav-links { display: flex; gap: 32px; align-items: center; }
.nav-link {
  color: var(--text2); text-decoration: none; letter-spacing: 2px;
  font-size: 11px; text-transform: uppercase;
  cursor: pointer; transition: color 0.2s;
  background: none; border: none; font-family: inherit;
}
.nav-link:hover { color: var(--accent); }
.cart-btn {
  position: relative; background: none; border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  transition: all 0.2s;
}
.cart-btn:hover { border-color: var(--accent); color: var(--accent); }
.cart-count {
  position: absolute; top: -6px; right: -6px;
  background: var(--accent); color: var(--bg);
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 500;
}

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── HERO ── */
.hero {
  min-height: 85vh;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  background: 
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(200,169,110,0.06) 0%, transparent 70%),
    var(--bg);
  position: relative; overflow: hidden;
  padding: 80px 40px;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 59px,
    rgba(255,255,255,0.015) 60px
  );
}
.hero-content { position: relative; z-index: 1; }
.hero-eyebrow {
  font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
  color: var(--accent); margin-bottom: 24px;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(60px, 10vw, 120px);
  font-weight: 300; line-height: 0.95;
  letter-spacing: -2px;
  color: var(--text);
  margin-bottom: 32px;
}
.hero-title em { font-style: italic; color: var(--accent); }
.hero-sub {
  color: var(--text2); font-size: 12px; letter-spacing: 2px;
  margin-bottom: 48px; max-width: 400px; margin-left: auto; margin-right: auto;
}
.btn-primary {
  background: var(--accent); color: var(--bg);
  border: none; padding: 14px 40px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }

/* ── CONTAINER ── */
.container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }

/* ── FILTERS ── */
.shop-header {
  padding: 60px 0 40px;
  display: flex; align-items: flex-end; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}
.shop-title {
  font-family: var(--font-display);
  font-size: 48px; font-weight: 300;
}
.filter-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.filter-btn {
  background: none; border: 1px solid var(--border);
  color: var(--text2); padding: 7px 16px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
}
.filter-btn:hover, .filter-btn.active {
  border-color: var(--accent); color: var(--accent);
}
.search-input {
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); padding: 7px 14px; width: 200px;
  font-family: var(--font-mono); font-size: 12px;
  outline: none; transition: border 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text3); }

/* ── PRODUCT GRID ── */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 2px;
  margin-bottom: 80px;
}
.product-card {
  background: var(--bg2);
  cursor: pointer;
  transition: transform 0.3s;
  position: relative; overflow: hidden;
}
.product-card:hover { transform: translateY(-4px); }
.product-card:hover .product-img { transform: scale(1.04); }
.product-img-wrap { overflow: hidden; aspect-ratio: 1/1; }
.product-img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s ease;
  display: block;
}
.product-img-placeholder {
  width: 100%; aspect-ratio: 1/1;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); font-size: 48px;
}
.product-info { padding: 20px; }
.product-category {
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.product-name {
  font-family: var(--font-display); font-size: 20px; font-weight: 400;
  margin-bottom: 4px; line-height: 1.2;
}
.product-price {
  font-size: 13px; color: var(--text2); letter-spacing: 1px;
}
.product-stock {
  font-size: 10px; margin-top: 8px; letter-spacing: 1px;
}
.in-stock { color: var(--success); }
.low-stock { color: var(--accent); }
.out-stock { color: var(--danger); }
.product-add-btn {
  width: 100%; margin-top: 12px;
  background: none; border: 1px solid var(--border);
  color: var(--text2); padding: 10px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.product-add-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.product-add-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── PRODUCT DETAIL ── */
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 80px; padding: 80px 0;
}
.detail-img-wrap { aspect-ratio: 1/1; overflow: hidden; }
.detail-img { width: 100%; height: 100%; object-fit: cover; }
.detail-info { display: flex; flex-direction: column; gap: 24px; }
.detail-cat {
  font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent);
}
.detail-name {
  font-family: var(--font-display); font-size: 52px; font-weight: 300; line-height: 1;
}
.detail-price {
  font-size: 28px; font-family: var(--font-display); color: var(--accent2);
}
.detail-desc { color: var(--text2); line-height: 1.8; font-size: 13px; }
.detail-divider { border: none; border-top: 1px solid var(--border); }
.qty-row { display: flex; align-items: center; gap: 16px; }
.qty-btn {
  width: 36px; height: 36px; border: 1px solid var(--border);
  background: none; color: var(--text); font-size: 18px;
  cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
}
.qty-btn:hover { border-color: var(--accent); color: var(--accent); }
.qty-val { font-size: 16px; min-width: 24px; text-align: center; }
.btn-add-cart {
  background: var(--accent); color: var(--bg);
  border: none; padding: 16px 40px; width: 100%;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.btn-add-cart:hover { background: var(--accent2); }
.btn-add-cart:disabled { opacity: 0.4; cursor: not-allowed; }
.back-btn {
  background: none; border: none; color: var(--text2);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  cursor: pointer; padding: 60px 0 0; display: inline-flex; align-items: center; gap: 8px;
  transition: color 0.2s; text-transform: uppercase;
}
.back-btn:hover { color: var(--accent); }

/* ── CART ── */
.cart-layout {
  display: grid; grid-template-columns: 1fr 380px;
  gap: 48px; padding: 60px 0;
}
.cart-title {
  font-family: var(--font-display); font-size: 48px; font-weight: 300;
  margin-bottom: 40px;
}
.cart-empty {
  text-align: center; padding: 80px 0; color: var(--text2);
}
.cart-empty-icon { font-size: 48px; margin-bottom: 16px; }
.cart-item {
  display: grid; grid-template-columns: 80px 1fr auto;
  gap: 20px; align-items: center; padding: 20px 0;
  border-bottom: 1px solid var(--border);
}
.cart-item-img { width: 80px; height: 80px; object-fit: cover; }
.cart-item-name { font-family: var(--font-display); font-size: 18px; }
.cart-item-price { color: var(--text2); font-size: 12px; margin-top: 4px; }
.cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.cart-item-total { font-family: var(--font-display); font-size: 20px; color: var(--accent); }
.cart-item-remove {
  background: none; border: none; color: var(--text3);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
  cursor: pointer; text-transform: uppercase; transition: color 0.2s;
}
.cart-item-remove:hover { color: var(--danger); }
.cart-qty-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.cart-qty-btn {
  width: 24px; height: 24px; border: 1px solid var(--border);
  background: none; color: var(--text); cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.cart-qty-btn:hover { border-color: var(--accent); color: var(--accent); }
.order-summary {
  background: var(--bg2); border: 1px solid var(--border);
  padding: 32px; height: fit-content; position: sticky; top: 80px;
}
.summary-title {
  font-family: var(--font-display); font-size: 24px; margin-bottom: 24px;
}
.summary-row {
  display: flex; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  color: var(--text2); font-size: 12px;
}
.summary-row.total {
  border-bottom: none; color: var(--text);
  font-family: var(--font-display); font-size: 22px; padding-top: 20px;
}
.checkout-btn {
  width: 100%; margin-top: 24px;
  background: var(--accent); color: var(--bg);
  border: none; padding: 16px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.checkout-btn:hover { background: var(--accent2); }
.checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── CHECKOUT ── */
.checkout-grid {
  display: grid; grid-template-columns: 1fr 380px;
  gap: 48px; padding: 60px 0;
}
.checkout-title {
  font-family: var(--font-display); font-size: 48px; font-weight: 300;
  margin-bottom: 40px;
}
.form-section { margin-bottom: 40px; }
.form-section-title {
  font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--accent); margin-bottom: 20px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.form-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text2); }
.form-input {
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); padding: 12px 14px;
  font-family: var(--font-mono); font-size: 12px;
  outline: none; transition: border 0.2s; width: 100%;
}
.form-input:focus { border-color: var(--accent); }
textarea.form-input { resize: vertical; min-height: 80px; }

/* ── MODAL (AUTH) ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  width: 440px; max-width: 95vw; padding: 48px;
  transform: translateY(20px); transition: transform 0.3s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title {
  font-family: var(--font-display); font-size: 36px; font-weight: 300;
  margin-bottom: 8px;
}
.modal-sub { color: var(--text2); font-size: 12px; margin-bottom: 32px; }
.modal-tabs { display: flex; gap: 0; margin-bottom: 32px; }
.modal-tab {
  flex: 1; padding: 10px; background: none;
  border: 1px solid var(--border); color: var(--text2);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.modal-tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.modal-close {
  position: absolute; top: 20px; right: 20px;
  background: none; border: none; color: var(--text3);
  font-size: 20px; cursor: pointer; transition: color 0.2s;
}
.modal-close:hover { color: var(--text); }
.modal { position: relative; }
.error-msg { color: var(--danger); font-size: 11px; margin-top: -8px; margin-bottom: 12px; }
.success-msg { color: var(--success); font-size: 11px; margin-bottom: 12px; }

/* ── ORDERS ── */
.orders-title {
  font-family: var(--font-display); font-size: 48px; font-weight: 300;
  padding: 60px 0 40px; border-bottom: 1px solid var(--border); margin-bottom: 40px;
}
.order-card {
  background: var(--bg2); border: 1px solid var(--border);
  margin-bottom: 16px; overflow: hidden;
}
.order-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; cursor: pointer;
  transition: background 0.2s;
}
.order-header:hover { background: var(--bg3); }
.order-id { font-family: var(--font-display); font-size: 20px; }
.order-date { color: var(--text2); font-size: 11px; }
.order-status {
  padding: 4px 12px; border: 1px solid;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
}
.status-pending { color: var(--accent); border-color: var(--accent); }
.status-processing { color: #4aa8e8; border-color: #4aa8e8; }
.status-shipped { color: #9b59b6; border-color: #9b59b6; }
.status-delivered { color: var(--success); border-color: var(--success); }
.status-cancelled { color: var(--danger); border-color: var(--danger); }
.order-total { font-family: var(--font-display); font-size: 20px; color: var(--accent2); }
.order-items { padding: 0 24px 24px; border-top: 1px solid var(--border); display: none; }
.order-items.open { display: block; padding-top: 20px; }
.order-item-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; color: var(--text2); font-size: 12px;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 32px; right: 32px; z-index: 2000;
  background: var(--bg2); border: 1px solid var(--accent);
  padding: 16px 24px; max-width: 320px;
  transform: translateX(120%); transition: transform 0.4s cubic-bezier(.16,1,.3,1);
  font-size: 12px; letter-spacing: 1px;
}
.toast.show { transform: translateX(0); }
.toast.error { border-color: var(--danger); }

/* ── LOADING ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 80px; color: var(--text3); letter-spacing: 3px;
  font-size: 11px; text-transform: uppercase;
}
.spinner {
  width: 20px; height: 20px; border: 1px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .detail-grid, .cart-layout, .checkout-grid { grid-template-columns: 1fr; }
  .cart-layout { gap: 32px; }
  .nav-links { gap: 16px; }
  nav { padding: 0 20px; }
  .container { padding: 0 20px; }
  .shop-header { flex-direction: column; align-items: flex-start; gap: 20px; }
}
@media (max-width: 600px) {
  .form-row { grid-template-columns: 1fr; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo" onclick="showPage('home')">LUMINA</div>
  <div class="nav-links">
    <button class="nav-link" onclick="showPage('shop')">Shop</button>
    <button class="nav-link" id="ordersNav" onclick="goOrders()" style="display:none">Orders</button>
    <button class="nav-link" id="loginNav" onclick="openAuth('login')">Sign In</button>
    <span class="nav-link" id="userNav" style="display:none; color:var(--accent)"></span>
    <button class="nav-link" id="logoutNav" onclick="doLogout()" style="display:none">Logout</button>
    <button class="cart-btn" onclick="showPage('cart')">
      Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<!-- PAGES -->
<div id="page-home" class="page active">
  <div class="hero">
    <div class="hero-content">
      <p class="hero-eyebrow">New Collection 2025</p>
      <h1 class="hero-title">Curated<br><em>Excellence</em></h1>
      <p class="hero-sub">Discover products that define quality, craftsmanship, and timeless design.</p>
      <button class="btn-primary" onclick="showPage('shop')">Explore Collection</button>
    </div>
  </div>
</div>

<div id="page-shop" class="page">
  <div class="container">
    <div class="shop-header">
      <h2 class="shop-title">Collection</h2>
      <div class="filter-bar">
        <input class="search-input" type="text" id="searchInput" placeholder="Search..." oninput="filterProducts()">
        <button class="filter-btn active" data-cat="" onclick="setCat(this, '')">All</button>
        <div id="categoryFilters"></div>
      </div>
    </div>
    <div id="productsGrid" class="products-grid">
      <div class="loading"><div class="spinner"></div>Loading</div>
    </div>
  </div>
</div>

<div id="page-detail" class="page">
  <div class="container">
    <button class="back-btn" onclick="showPage('shop')">← Back to Shop</button>
    <div id="detailContent" class="detail-grid"></div>
  </div>
</div>

<div id="page-cart" class="page">
  <div class="container cart-layout">
    <div>
      <h2 class="cart-title">Your Cart</h2>
      <div id="cartItems"></div>
    </div>
    <div class="order-summary">
      <div class="summary-title">Order Summary</div>
      <div id="summaryRows"></div>
      <div class="summary-row total">
        <span>Total</span><span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="goCheckout()">Proceed to Checkout</button>
    </div>
  </div>
</div>

<div id="page-checkout" class="page">
  <div class="container checkout-grid">
    <div>
      <h2 class="checkout-title">Checkout</h2>
      <div class="form-section">
        <div class="form-section-title">Shipping Address</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input class="form-input" id="shipFirst" type="text">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input class="form-input" id="shipLast" type="text">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input class="form-input" id="shipAddr" type="text">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">City</label>
            <input class="form-input" id="shipCity" type="text">
          </div>
          <div class="form-group">
            <label class="form-label">ZIP</label>
            <input class="form-input" id="shipZip" type="text">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Country</label>
          <input class="form-input" id="shipCountry" type="text" value="United States">
        </div>
      </div>
      <div id="checkoutError" class="error-msg" style="display:none"></div>
      <button class="btn-primary" onclick="placeOrder()" style="width:100%;padding:16px">Place Order</button>
    </div>
    <div class="order-summary">
      <div class="summary-title">Order Review</div>
      <div id="checkoutItems"></div>
      <div class="summary-row total">
        <span>Total</span><span id="checkoutTotal">$0.00</span>
      </div>
    </div>
  </div>
</div>

<div id="page-orders" class="page">
  <div class="container">
    <h2 class="orders-title">My Orders</h2>
    <div id="ordersList"></div>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeAuth()">✕</button>
    <h2 class="modal-title" id="authTitle">Welcome Back</h2>
    <p class="modal-sub" id="authSub">Sign in to your account</p>
    <div class="modal-tabs">
      <button class="modal-tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
      <button class="modal-tab" id="registerTab" onclick="switchTab('register')">Register</button>
    </div>
    <div id="authError" class="error-msg" style="display:none"></div>
    <div id="authSuccess" class="success-msg" style="display:none"></div>

    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="loginUsername" type="text" placeholder="your_username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="loginPassword" type="password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="doLogin()" style="width:100%;padding:14px;margin-top:8px">Sign In</button>
    </div>

    <div id="registerForm" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input class="form-input" id="regFirst" type="text">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input class="form-input" id="regLast" type="text">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="regUsername" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="regEmail" type="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="regPassword" type="password">
      </div>
      <button class="btn-primary" onclick="doRegister()" style="width:100%;padding:14px;margin-top:8px">Create Account</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let cart = JSON.parse(localStorage.getItem('cart') || '[]');
let products = [];
let categories = [];
let currentUser = null;
let activeCategory = '';
let detailQty = 1;

const API = '/api';

// ── CSRF ──
function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}

async function apiFetch(url, opts = {}) {
  const defaults = {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') }
  };
  const res = await fetch(url, { ...defaults, ...opts, headers: { ...defaults.headers, ...(opts.headers || {}) } });
  return res;
}

// ── PAGES ──
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'shop') loadProducts();
  if (name === 'cart') renderCart();
  if (name === 'checkout') renderCheckout();
  if (name === 'orders') loadOrders();
  window.scrollTo(0, 0);
}

// ── TOAST ──
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── AUTH STATE ──
async function checkAuth() {
  try {
    const res = await apiFetch(API + '/auth/me/');
    if (res.ok) {
      currentUser = await res.json();
      updateAuthUI();
    }
  } catch {}
}

function updateAuthUI() {
  const loggedIn = !!currentUser;
  document.getElementById('loginNav').style.display = loggedIn ? 'none' : '';
  document.getElementById('userNav').style.display = loggedIn ? '' : 'none';
  document.getElementById('logoutNav').style.display = loggedIn ? '' : 'none';
  document.getElementById('ordersNav').style.display = loggedIn ? '' : 'none';
  if (loggedIn) document.getElementById('userNav').textContent = currentUser.first_name || currentUser.username;
}

async function doLogout() {
  await apiFetch(API + '/auth/logout/', { method: 'POST' });
  currentUser = null;
  updateAuthUI();
  toast('Logged out');
}

// ── AUTH MODAL ──
let authTab = 'login';
function openAuth(tab = 'login') {
  document.getElementById('authModal').classList.add('open');
  switchTab(tab);
  clearAuthMsgs();
}
function closeAuth() { document.getElementById('authModal').classList.remove('open'); }
function clearAuthMsgs() {
  document.getElementById('authError').style.display = 'none';
  document.getElementById('authSuccess').style.display = 'none';
}
function switchTab(tab) {
  authTab = tab;
  document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('loginTab').className = 'modal-tab' + (tab === 'login' ? ' active' : '');
  document.getElementById('registerTab').className = 'modal-tab' + (tab === 'register' ? ' active' : '');
  document.getElementById('authTitle').textContent = tab === 'login' ? 'Welcome Back' : 'Join LUMINA';
  document.getElementById('authSub').textContent = tab === 'login' ? 'Sign in to your account' : 'Create your account';
  clearAuthMsgs();
}
document.getElementById('authModal').addEventListener('click', e => {
  if (e.target === document.getElementById('authModal')) closeAuth();
});

async function doLogin() {
  clearAuthMsgs();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) return showAuthError('Please fill in all fields');
  const res = await apiFetch(API + '/auth/login/', { method: 'POST', body: JSON.stringify({ username, password }) });
  const data = await res.json();
  if (res.ok) {
    currentUser = data;
    updateAuthUI();
    closeAuth();
    toast('Welcome back, ' + (data.first_name || data.username) + '!');
  } else {
    showAuthError(data.error || 'Login failed');
  }
}

async function doRegister() {
  clearAuthMsgs();
  const payload = {
    first_name: document.getElementById('regFirst').value.trim(),
    last_name: document.getElementById('regLast').value.trim(),
    username: document.getElementById('regUsername').value.trim(),
    email: document.getElementById('regEmail').value.trim(),
    password: document.getElementById('regPassword').value,
  };
  if (!payload.username || !payload.email || !payload.password) return showAuthError('Please fill in all required fields');
  const res = await apiFetch(API + '/auth/register/', { method: 'POST', body: JSON.stringify(payload) });
  const data = await res.json();
  if (res.ok) {
    currentUser = data;
    updateAuthUI();
    closeAuth();
    toast('Account created! Welcome, ' + (data.first_name || data.username) + '!');
  } else {
    showAuthError(Object.values(data).join(' '));
  }
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = '';
}

// ── PRODUCTS ──
async function loadProducts() {
  if (products.length === 0) {
    document.getElementById('productsGrid').innerHTML = '<div class="loading"><div class="spinner"></div>Loading</div>';
    const [pRes, cRes] = await Promise.all([
      apiFetch(API + '/products/'),
      apiFetch(API + '/categories/')
    ]);
    products = (await pRes.json()).results || await pRes.clone().json();
    categories = (await cRes.json()).results || await cRes.clone().json();
    renderCategoryFilters();
  }
  renderProducts();
}

// Re-fetch since DRF paginates
async function loadProducts() {
  if (products.length === 0) {
    document.getElementById('productsGrid').innerHTML = '<div class="loading"><div class="spinner"></div>Loading</div>';
    try {
      const [pRes, cRes] = await Promise.all([
        fetch(API + '/products/?format=json'),
        fetch(API + '/categories/?format=json')
      ]);
      const pData = await pRes.json();
      const cData = await cRes.json();
      products = pData.results || pData;
      categories = cData.results || cData;
      renderCategoryFilters();
    } catch (e) {
      document.getElementById('productsGrid').innerHTML = '<div class="loading">Failed to load products</div>';
      return;
    }
  }
  renderProducts();
}

function renderCategoryFilters() {
  const container = document.getElementById('categoryFilters');
  container.innerHTML = categories.map(c =>
    `<button class="filter-btn" data-cat="${c.slug}" onclick="setCat(this,'${c.slug}')">${c.name}</button>`
  ).join('');
}

function setCat(btn, slug) {
  activeCategory = slug;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

function filterProducts() { renderProducts(); }

function renderProducts() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = products.filter(p => {
    const matchCat = !activeCategory || p.category_name?.toLowerCase().replace(/\s+/g, '-') === activeCategory || (categories.find(c=>c.id===p.category)?.slug === activeCategory);
    const matchSearch = !search || p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  if (!filtered.length) {
    document.getElementById('productsGrid').innerHTML = '<div class="loading">No products found</div>';
    return;
  }

  document.getElementById('productsGrid').innerHTML = filtered.map(p => `
    <div class="product-card" onclick="showDetail(${p.id})">
      <div class="product-img-wrap">
        ${p.image_url
          ? `<img class="product-img" src="${p.image_url}" alt="${p.name}" loading="lazy">`
          : `<div class="product-img-placeholder">📦</div>`}
      </div>
      <div class="product-info">
        <div class="product-category">${p.category_name || ''}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
        <div class="product-stock ${p.stock > 10 ? 'in-stock' : p.stock > 0 ? 'low-stock' : 'out-stock'}">
          ${p.stock > 10 ? '✓ In Stock' : p.stock > 0 ? `Only ${p.stock} left` : '✗ Out of Stock'}
        </div>
        <button class="product-add-btn" ${p.stock === 0 ? 'disabled' : ''}
          onclick="event.stopPropagation(); addToCart(${p.id})">
          ${p.stock === 0 ? 'Out of Stock' : 'Add to Cart'}
        </button>
      </div>
    </div>
  `).join('');
}

// ── PRODUCT DETAIL ──
async function showDetail(id) {
  showPage('detail');
  detailQty = 1;
  document.getElementById('detailContent').innerHTML = '<div class="loading"><div class="spinner"></div>Loading</div>';
  const res = await fetch(API + `/products/${id}/`);
  const p = await res.json();

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-img-wrap">
      ${p.image_url
        ? `<img class="detail-img" src="${p.image_url}" alt="${p.name}">`
        : `<div class="product-img-placeholder" style="aspect-ratio:1/1">📦</div>`}
    </div>
    <div class="detail-info">
      <div class="detail-cat">${p.category_name}</div>
      <h1 class="detail-name">${p.name}</h1>
      <div class="detail-price">$${parseFloat(p.price).toFixed(2)}</div>
      <hr class="detail-divider">
      <p class="detail-desc">${p.description}</p>
      <div class="product-stock ${p.stock > 10 ? 'in-stock' : p.stock > 0 ? 'low-stock' : 'out-stock'}">
        ${p.stock > 10 ? '✓ In Stock' : p.stock > 0 ? `Only ${p.stock} left` : '✗ Out of Stock'}
      </div>
      <hr class="detail-divider">
      <div class="qty-row">
        <button class="qty-btn" onclick="changeDetailQty(-1)">−</button>
        <span class="qty-val" id="detailQtyVal">1</span>
        <button class="qty-btn" onclick="changeDetailQty(1)">+</button>
        <span style="color:var(--text2);font-size:11px;letter-spacing:2px">QUANTITY</span>
      </div>
      <button class="btn-add-cart" ${p.stock === 0 ? 'disabled' : ''} onclick="addToCartDetail(${p.id}, ${p.stock})">
        ${p.stock === 0 ? 'Out of Stock' : 'Add to Cart'}
      </button>
    </div>
  `;
}

function changeDetailQty(delta) {
  detailQty = Math.max(1, detailQty + delta);
  document.getElementById('detailQtyVal').textContent = detailQty;
}

function addToCartDetail(id, maxStock) {
  const qty = Math.min(detailQty, maxStock);
  for (let i = 0; i < qty; i++) addToCart(id, false);
  toast(`Added ${qty} item(s) to cart`);
}

// ── CART ──
function addToCart(productId, showToast = true) {
  const p = products.find(p => p.id === productId);
  if (!p || p.stock === 0) return;
  const existing = cart.find(i => i.id === productId);
  if (existing) {
    existing.qty = Math.min(existing.qty + 1, p.stock);
  } else {
    cart.push({ id: productId, qty: 1 });
  }
  saveCart();
  if (showToast) toast(`${p.name} added to cart`);
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
  renderCart();
}

function updateCartQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  const p = products.find(p => p.id === id);
  item.qty = Math.max(1, Math.min(item.qty + delta, p?.stock || 99));
  saveCart();
  renderCart();
}

function saveCart() {
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = count;
}

function getCartTotal() {
  return cart.reduce((sum, item) => {
    const p = products.find(p => p.id === item.id);
    return sum + (p ? parseFloat(p.price) * item.qty : 0);
  }, 0);
}

function renderCart() {
  const container = document.getElementById('cartItems');
  if (!cart.length) {
    container.innerHTML = `<div class="cart-empty">
      <div class="cart-empty-icon">🛒</div>
      <div>Your cart is empty</div>
      <button class="btn-primary" style="margin-top:24px" onclick="showPage('shop')">Continue Shopping</button>
    </div>`;
    document.getElementById('summaryRows').innerHTML = '';
    document.getElementById('cartTotal').textContent = '$0.00';
    document.getElementById('checkoutBtn').disabled = true;
    return;
  }

  // load missing products
  const missing = cart.filter(i => !products.find(p => p.id === i.id));
  if (missing.length) {
    Promise.all(missing.map(i => fetch(API+`/products/${i.id}/`).then(r=>r.json()))).then(ps => {
      products.push(...ps);
      renderCart();
    });
    return;
  }

  container.innerHTML = cart.map(item => {
    const p = products.find(p => p.id === item.id);
    if (!p) return '';
    return `
    <div class="cart-item">
      ${p.image_url ? `<img class="cart-item-img" src="${p.image_url}" alt="${p.name}">` : `<div class="cart-item-img" style="background:var(--bg3);display:flex;align-items:center;justify-content:center">📦</div>`}
      <div>
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-price">$${parseFloat(p.price).toFixed(2)} each</div>
        <div class="cart-qty-row">
          <button class="cart-qty-btn" onclick="updateCartQty(${p.id},-1)">−</button>
          <span>${item.qty}</span>
          <button class="cart-qty-btn" onclick="updateCartQty(${p.id},1)">+</button>
        </div>
      </div>
      <div class="cart-item-right">
        <div class="cart-item-total">$${(parseFloat(p.price)*item.qty).toFixed(2)}</div>
        <button class="cart-item-remove" onclick="removeFromCart(${p.id})">Remove</button>
      </div>
    </div>`;
  }).join('');

  const total = getCartTotal();
  document.getElementById('summaryRows').innerHTML = cart.map(item => {
    const p = products.find(p => p.id === item.id);
    return p ? `<div class="summary-row"><span>${p.name} ×${item.qty}</span><span>$${(parseFloat(p.price)*item.qty).toFixed(2)}</span></div>` : '';
  }).join('');
  document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
  document.getElementById('checkoutBtn').disabled = false;
}

function goCheckout() {
  if (!currentUser) { openAuth('login'); return; }
  showPage('checkout');
}

function renderCheckout() {
  const items = document.getElementById('checkoutItems');
  const total = getCartTotal();
  items.innerHTML = cart.map(item => {
    const p = products.find(p => p.id === item.id);
    return p ? `<div class="summary-row"><span>${p.name} ×${item.qty}</span><span>$${(parseFloat(p.price)*item.qty).toFixed(2)}</span></div>` : '';
  }).join('');
  document.getElementById('checkoutTotal').textContent = `$${total.toFixed(2)}`;
}

async function placeOrder() {
  if (!currentUser) { openAuth('login'); return; }
  const addr = [
    document.getElementById('shipFirst').value,
    document.getElementById('shipLast').value,
    document.getElementById('shipAddr').value,
    document.getElementById('shipCity').value,
    document.getElementById('shipZip').value,
    document.getElementById('shipCountry').value
  ].filter(Boolean);

  if (addr.length < 4) {
    document.getElementById('checkoutError').textContent = 'Please fill in all shipping fields';
    document.getElementById('checkoutError').style.display = '';
    return;
  }
  document.getElementById('checkoutError').style.display = 'none';

  const payload = {
    shipping_address: addr.join(', '),
    items: cart.map(i => ({ product_id: i.id, quantity: i.qty }))
  };

  const res = await apiFetch(API + '/orders/', { method: 'POST', body: JSON.stringify(payload) });
  const data = await res.json();
  if (res.ok) {
    cart = [];
    saveCart();
    toast('Order placed! Order #' + data.id);
    showPage('orders');
  } else {
    document.getElementById('checkoutError').textContent = data.error || 'Order failed';
    document.getElementById('checkoutError').style.display = '';
  }
}

// ── ORDERS ──
function goOrders() {
  if (!currentUser) { openAuth('login'); return; }
  showPage('orders');
}

async function loadOrders() {
  if (!currentUser) {
    document.getElementById('ordersList').innerHTML = '<div class="loading">Please sign in to view orders</div>';
    return;
  }
  document.getElementById('ordersList').innerHTML = '<div class="loading"><div class="spinner"></div>Loading</div>';
  const res = await apiFetch(API + '/orders/my/');
  if (!res.ok) {
    document.getElementById('ordersList').innerHTML = '<div class="loading">Failed to load orders</div>';
    return;
  }
  const orders = await res.json();
  if (!orders.length) {
    document.getElementById('ordersList').innerHTML = '<div class="loading">No orders yet</div>';
    return;
  }
  document.getElementById('ordersList').innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-header" onclick="toggleOrder(${o.id})">
        <div>
          <div class="order-id">Order #${o.id}</div>
          <div class="order-date">${new Date(o.created_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
        </div>
        <span class="order-status status-${o.status}">${o.status}</span>
        <div class="order-total">$${parseFloat(o.total_price).toFixed(2)}</div>
      </div>
      <div class="order-items" id="order-${o.id}">
        ${o.items.map(i => `
          <div class="order-item-row">
            <span>${i.product_name} ×${i.quantity}</span>
            <span>$${(parseFloat(i.price)*i.quantity).toFixed(2)}</span>
          </div>
        `).join('')}
        <div style="padding-top:12px;color:var(--text3);font-size:11px">${o.shipping_address}</div>
      </div>
    </div>
  `).join('');
}

function toggleOrder(id) {
  const el = document.getElementById('order-' + id);
  el.classList.toggle('open');
}

// ── INIT ──
updateCartCount();
checkAuth();
</script>
</body>
</html>
